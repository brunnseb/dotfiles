# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ==================
# MONITOR CONFIG
# ==================
# monitor = eDP-2, 2560x1600@239.998993, 2560x0, 1, vrr, 1
monitor = , preferred,auto,auto
source = ./monitors.conf

# ==================
# ENVIRONMENT VARS
# ==================
env = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME_QT6,gtk3
env = TERMINAL,kitty

# ==================
# STARTUP APPS
# ==================
exec-once = bash -c "wl-paste --watch cliphist store &"
exec-once = dms run
exec-once = /usr/lib/mate-polkit/polkit-mate-authentication-agent-1

# ==================
# INPUT CONFIG
# ==================
input {
    kb_layout = us, us
    kb_variant = altgr-intl, colemak_dh
    kb_options = grp:ctrl_space_toggle
}

# ==================
# GENERAL LAYOUT
# ==================
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 0  # off in niri

    col.active_border = rgba(707070ff)
    col.inactive_border = rgba(d0d0d0ff)

    layout = scrolling
}

# ==================
# DECORATION
# ==================
decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 30
        render_power = 5
        offset = 0 5
        color = rgba(00000070)
    }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    on_focus_under_fullscreen = 1
}

plugin {
    hyprscrolling {
        fullscreen_on_one_column = true
        follow_focus = true
    }
}

# ==================
# WINDOW RULES
# ==================

windowrule = tile on, match:class ^(org\.wezfurlong\.wezterm)$
windowrule = rounding 12, match:class ^(org\.gnome\.)
windowrule =  border_size 0, match:class ^(org\.gnome\.)

windowrule = tile on, match:class ^(gnome-control-center)$
windowrule = tile on, match:class ^(pavucontrol)$
windowrule = tile on, match:class ^(nm-connection-editor)$

windowrule = float on, match:class ^(gnome-calculator)$
windowrule = float on, match:class ^(galculator)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(org\.gnome\.Nautilus)$
windowrule = float on, match:class ^(steam)$
windowrule = float on, match:class ^(xdg-desktop-portal)$
windowrule = opacity 0.85, match:class ^(zen-twilight)$

windowrule = border_size 0, match:class ^(org\.wezfurlong\.wezterm)$
windowrule = border_size 0, match:class ^(Alacritty)$
windowrule = border_size 0, match:class ^(zen)$
windowrule = border_size 0, match:class ^(zen-twilight)$
windowrule = border_size 0, match:class ^(com\.mitchellh\.ghostty)$
windowrule = border_size 0, match:class ^(kitty)$

windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(zoom)$

windowrule = opacity 0.9 0.9, match:float no, match:focus no

# layerrule = noanim, ^(quickshell)$

# ==================
# KEYBINDINGS
# ==================
$mod = SUPER

# === Application Launchers ===
bind = $mod, return, exec, kitty
bind = $mod, V, exec, dms ipc call clipboard toggle
bind = $mod, S, exec, dms ipc call settings toggle
bind = $mod, K, exec, dms ipc call notifications toggle

# === Cheat sheet
bind = $mod SHIFT, Slash, exec, dms ipc call keybinds toggle hyprland

# === Security ===
bind = $mod, Escape, exec, dms ipc call lock lock
bind = CTRL ALT, Delete, exec, dms ipc call processlist toggle

# === Audio Controls ===
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bindl = , XF86AudioMicMute, exec, dms ipc call audio micmute

# === Brightness Controls ===
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""

# === Numbered Workspaces ===
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# === Move to Numbered Workspaces ===
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# === Sizing & Layout ===
# bind = $mod, R, layoutmsg, togglesplit

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindmd = ALT, mouse:272, Move window, movewindow
bindmd = ALT, mouse:273, Resize window, resizewindow

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindd = ALT, code:20, Expand window left, resizeactive, -100 0
bindd = ALT, code:21, Shrink window left, resizeactive, 100 0

# === Manual Sizing ===

# === Screenshots ===
bind = $mod, P, exec, grimblast save area - | satty --filename - --output-filename /home/brunnseb/Pictures/screenshots/Screenshot-$(date '+%Y%m%d-%H:%M:%S').png
bind = $mod SHIFT, P, exec, grimblast copy area

# === System Controls ===


bind = $mod, $mod_L, exec, walker
bind = $mod, W, exec, walker -m windows
bind = $mod, Period, exec, walker -m symbols
bind = $mod, g, hyprexpo:expo, toggle
bind = $mod, c, exec, zen-twilight

bind = $mod, left, exec,  hyprctl dispatch layoutmsg focus l 
bind = $mod, right, exec,  hyprctl dispatch layoutmsg focus r 
bind = $mod, up, exec,  hyprctl dispatch layoutmsg focus u 
bind = $mod, down, exec,  hyprctl dispatch layoutmsg focus d
bind = $mod, TAB, exec,  hyprctl dispatch layoutmsg promote
bind = $mod SHIFT, left, exec,  hyprctl dispatch layoutmsg movewindowto l
bind = $mod SHIFT, right, exec,  hyprctl dispatch layoutmsg movewindowto r
bind = $mod SHIFT, up, exec,  hyprctl dispatch layoutmsg movewindowto u
bind = $mod SHIFT, down, exec,  hyprctl dispatch layoutmsg movewindowto d
bind = $mod ALT SHIFT, left, exec, hyprctl dispatch split-changemonitor prev
bind = $mod ALT SHIFT, right, exec, hyprctl dispatch split-changemonitor next
bind = $mod ALT, left, exec, hyprctl dispatch focusmonitor -1
bind = $mod ALT, right, exec, hyprctl dispatch focusmonitor +1
bind = $mod SHIFT, Q, killactive, 
bind = $mod SHIFT ALT, Q, exec, hyprctl kill 
bind = $mod, R, exec,  hyprctl keyword general:layout hy3 || hyprctl keyword general:layout scrolling
bind = $mod SHIFT, A, exec, hyprctl activewindow -j | jq -e '.workspace.id > 0' &&  hyprctl dispatch movetoworkspacesilent special:communication || hyprctl dispatch movetoworkspacesilent +0
bind = $mod, B, exec, hyprctl dispatch layoutmsg togglefit
bind = $mod, MINUS, exec, hyprctl dispatch layoutmsg colresize +0.2
bind = $mod SHIFT, MINUS, exec, hyprctl dispatch layoutmsg colresize -0.2
# bind = $mod ALT, MINUS, exec, hyprctl dispatch layoutmsg colresize -conf
bind = ALT, space, exec, hyprctl dispatch togglefloating

bind = $mod, F, exec, hyprctl dispatch layoutmsg colresize 1
bind = $mod SHIFT, F, exec, hyprctl dispatch layoutmsg colresize 0.5

exec-once = sleep 1 && /opt/forticlient/start-fortitray-launcher.sh
exec-once = sleep 1 && /usr/bin/ktailctl
exec-once = /usr/bin/elephant &
exec-once = /usr/bin/walker --gapplication-service
exec-once = hyprpm reload -n

source = ~/.config/hypr/monitors.conf
source = ./dms/cursor.conf

bindl = , switch:on:Lid Switch, exec, /home/brunnseb/.config/hypr/scripts/lidswitch.sh close
bindl = , switch:off:Lid Switch, exec, /home/brunnseb/.config/hypr/scripts/lidswitch.sh open

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = HYPRCURSOR_THEME,rose-pine-hyprcursor

