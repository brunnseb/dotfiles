# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ==================
# MONITOR CONFIG
# ==================
# monitor = eDP-2, 2560x1600@239.998993, 2560x0, 1, vrr, 1
monitor = , preferred,auto,auto
source = ./monitors.conf

# ==================
# ENVIRONMENT VARS
# ==================
env = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME_QT6,gtk3
env = TERMINAL,kitty

# ==================
# STARTUP APPS
# ==================
exec-once = bash -c "wl-paste --watch cliphist store &"
exec-once = dms run
exec-once = /usr/lib/mate-polkit/polkit-mate-authentication-agent-1

# ==================
# INPUT CONFIG
# ==================
input {
    kb_layout = us
    numlock_by_default = true
}

# ==================
# GENERAL LAYOUT
# ==================
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 0  # off in niri

    col.active_border = rgba(707070ff)
    col.inactive_border = rgba(d0d0d0ff)

    layout = dwindle
}

# ==================
# DECORATION
# ==================
decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 30
        render_power = 5
        offset = 0 5
        color = rgba(00000070)
    }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
}

# ==================
# WINDOW RULES
# ==================
windowrulev2 = tile, class:^(org\.wezfurlong\.wezterm)$

windowrulev2 = rounding 12, class:^(org\.gnome\.)
windowrulev2 = noborder, class:^(org\.gnome\.)

windowrulev2 = tile, class:^(gnome-control-center)$
windowrulev2 = tile, class:^(pavucontrol)$
windowrulev2 = tile, class:^(nm-connection-editor)$

windowrulev2 = float, class:^(gnome-calculator)$
windowrulev2 = float, class:^(galculator)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(org\.gnome\.Nautilus)$
windowrulev2 = float, class:^(steam)$
windowrulev2 = float, class:^(xdg-desktop-portal)$
windowrulev2 = opacity 0.85, class:^(zen-twilight)$

windowrulev2 = noborder, class:^(org\.wezfurlong\.wezterm)$
windowrulev2 = noborder, class:^(Alacritty)$
windowrulev2 = noborder, class:^(zen)$
windowrulev2 = noborder, class:^(zen-twilight)$
windowrulev2 = noborder, class:^(com\.mitchellh\.ghostty)$
windowrulev2 = noborder, class:^(kitty)$

windowrulev2 = float, class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(zoom)$

windowrulev2 = opacity 0.9 0.9, floating:0, focus:0

layerrule = noanim, ^(quickshell)$

# ==================
# KEYBINDINGS
# ==================
$mod = SUPER

# === Application Launchers ===
bind = $mod, return, exec, kitty
bind = $mod, V, exec, dms ipc call clipboard toggle
bind = $mod, P, exec, dms ipc call processlist toggle
bind = $mod, comma, exec, dms ipc call settings toggle
bind = $mod, K, exec, dms ipc call notifications toggle

# === Cheat sheet
bind = $mod SHIFT, Slash, exec, dms ipc call keybinds toggle hyprland

# === Security ===
bind = $mod, Escape, exec, dms ipc call lock lock
bind = CTRL ALT, Delete, exec, dms ipc call processlist toggle

# === Audio Controls ===
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bindl = , XF86AudioMicMute, exec, dms ipc call audio micmute

# === Brightness Controls ===
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""

# === Numbered Workspaces ===
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# === Move to Numbered Workspaces ===
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# === Sizing & Layout ===
bind = $mod, R, layoutmsg, togglesplit
bind = $mod CTRL, F, resizeactive, exact 100%

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindmd = $mod, mouse:272, Move window, movewindow
bindmd = $mod, mouse:273, Resize window, resizewindow

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindd = $mod, code:20, Expand window left, resizeactive, -100 0
bindd = $mod, code:21, Shrink window left, resizeactive, 100 0

# === Manual Sizing ===
binde = $mod, minus, resizeactive, -10% 0
binde = $mod, equal, resizeactive, 10% 0
binde = $mod SHIFT, minus, resizeactive, 0 -10%
binde = $mod SHIFT, equal, resizeactive, 0 10%

# === Screenshots ===
bind = , XF86Launch1, exec, grimblast copy area
bind = CTRL, XF86Launch1, exec, grimblast copy screen
bind = ALT, XF86Launch1, exec, grimblast copy active
bind = , Print, exec, grimblast copy area
bind = CTRL, Print, exec, grimblast copy screen
bind = ALT, Print, exec, grimblast copy active

# === System Controls ===
bind = $mod SHIFT, P, dpms, off


bind = Super,Super_L, exec, walker
# bind = Super, V, exec, walker -m clipboard
bind = Super, Period, exec, walker -m symbols
bind = SUPER, g, hyprexpo:expo, toggle
bind = SUPER, c, exec, zen-twilight

bind = Super, left, exec,  hyprctl dispatch layoutmsg focus l 
bind = Super, right, exec,  hyprctl dispatch layoutmsg focus r 
bind = Super, up, exec,  hyprctl dispatch layoutmsg focus u 
bind = Super, down, exec,  hyprctl dispatch layoutmsg focus d
bind = Super+Shift, left, exec,  hyprctl dispatch layoutmsg swapcol l
bind = Super+Shift, right, exec,  hyprctl dispatch layoutmsg swapcol r
bind = Alt+Shift, left, exec,  hyprctl dispatch layoutmsg movewindowto l
bind = Alt+Shift, right, exec,  hyprctl dispatch layoutmsg movewindowto r
bind = Alt+Shift, up, exec,  hyprctl dispatch layoutmsg movewindowto u
bind = Alt+Shift, down, exec,  hyprctl dispatch layoutmsg movewindowto d
bind = Super+Alt+Shift, left, exec, hyprctl dispatch split-changemonitor prev
bind = Super+Alt+Shift, right, exec, hyprctl dispatch split-changemonitor next
bind = Super+Alt, left, exec, hyprctl dispatch focusmonitor -1
bind = Super+Alt, right, exec, hyprctl dispatch focusmonitor +1
bind = Super+Shift, Q, killactive, 
bind = Super+Shift+Alt, Q, exec, hyprctl kill 
bind = Super, R, exec,  hyprctl keyword general:layout hy3 || hyprctl keyword general:layout scrolling
bind = Super+Shift, A, exec, hyprctl activewindow -j | jq -e '.workspace.id > 0' &&  hyprctl dispatch movetoworkspacesilent special:communication || hyprctl dispatch movetoworkspacesilent +0
bind = Super, B, exec, hyprctl dispatch layoutmsg togglefit
bind = Super, MINUS, exec, hyprctl dispatch layoutmsg colresize +conf

bind = Super, W, fullscreen, 1 

exec-once = sleep 1 && /opt/forticlient/start-fortitray-launcher.sh
exec-once = sleep 1 && /usr/bin/ktailctl
exec-once = /usr/bin/elephant &
exec-once = /usr/bin/walker --gapplication-service
exec-once = hyprpm reload -n

source = ~/.config/hypr/monitors.conf

bindl = , switch:on:Lid Switch, exec, /home/brunnseb/.config/hypr/scripts/lidswitch.sh close
bindl = , switch:off:Lid Switch, exec, /home/brunnseb/.config/hypr/scripts/lidswitch.sh open

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = HYPRCURSOR_THEME,rose-pine-hyprcursor

general {
    layout = scrolling
}


plugin {
    hyprscrolling {
        fullscreen_on_one_column = true
    }
}

input {
    kb_layout = us, us
    kb_variant = altgr-intl, colemak_dh
    kb_options = grp:ctrl_space_toggle
}
