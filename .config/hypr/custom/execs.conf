# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing
exec-once = sleep 1 && /opt/forticlient/start-fortitray-launcher.sh
exec-once = sleep 1 && /usr/bin/ktailctl
exec-once = /usr/bin/hyprshell run &
exec-once = /usr/bin/elephant &
exec-once = /usr/bin/walker --gapplication-service
exec-once = [ workspace special ] ferdium --disable_gpu
